# 自动构建并发布 StudyPilot release artifact（文档 §三/§四）。
# 触发：push v* 标签 → build/package → GitHub Release。
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: StudyPilot-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: StudyPilot-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: StudyPilot-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            artifact: StudyPilot-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release
        run: cargo build --release --bin studypilot --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            cp target/${{ matrix.target }}/release/studypilot.exe dist/studypilot.exe
            (cd dist && zip -r ../${{ matrix.artifact }}.zip .)
          else
            cp target/${{ matrix.target }}/release/studypilot dist/studypilot
            tar -C dist -czf ${{ matrix.artifact }}.tar.gz .
          fi

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            StudyPilot-*.zip
            StudyPilot-*.tar.gz
