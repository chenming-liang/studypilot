[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/importer",
    "crates/providers",
    "crates/storage",
    "crates/tools",
    "crates/tui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
arboard = "3"
async-trait = "0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
jieba-rs = "0.10"
libc = "0.2"
pulldown-cmark = "0.13"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syntect = { version = "5", default-features = false, features = ["parsing", "default-syntaxes", "default-themes", "regex-fancy", "dump-load"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
unicode-width = "0.2"
walkdir = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.dev]
# TUI 交互流畅优先（M4 起有感）
opt-level = 1
